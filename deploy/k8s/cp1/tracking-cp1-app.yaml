apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-cp1
  namespace: tracking
  labels:
    app: tracking-cp1
    version: v1
    app.kubernetes.io/name: tracking-cp1
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-cp1
      version: v1
      app.kubernetes.io/name: tracking-cp1
      app.kubernetes.io/version: v1
  template:
    metadata:
      labels:
        app: tracking-cp1
        version: v1
        app.kubernetes.io/name: tracking-cp1
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: tracking
          image: 172.16.200.26/quality/tracking
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tracking-cp1-config
          resources:
            limits:
              memory: "4Gi"
              cpu: "2"
            requests:
              memory: "512Mi"
              cpu: "200m"
          volumeMounts:
            - name: tracking-logs
              mountPath: /logs
      volumes:
        - name: tracking-logs
          persistentVolumeClaim:
            claimName: tracking-cp1-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-cp1
  namespace: tracking
  labels:
    app: tracking-cp1
    version: v1
    app.kubernetes.io/name: tracking-cp1
    app.kubernetes.io/version: v1
spec:
  selector:
    app: tracking-cp1
    version: v1
    app.kubernetes.io/name: tracking-cp1
    app.kubernetes.io/version: v1
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32331
  type: NodePort
