tracking:
  unit: cp1
  storage:
    abnormal:
      enabled: false
    tracking-result:
      enabled: false

server:
  port: 9000
  servlet:
    context-path: /

spring:
  application:
    name: tracking
  profiles:
    active: local

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wisdri.tracking.infrastructure.dto.postgres
  global-config:
    banner: false
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mqtt:
  client-id: tracking-${tracking.unit}-client-local
  completion-timeout: 3000
  qos: 1
  clean-session: true
  connection-timeout: 10
  keep-alive-interval: 20

rocketmq:
  producer:
    topic: tracking-data-fifo-topic
    request-timeout: 3
    max-attempts: 3
    ssl-enabled: false
  push-consumer:
    topic: tracking-data-fifo-topic
    tag: "${tracking.unit}"
    consumer-group: tracking-data-consumer-group-${tracking.unit}
    request-timeout: 3
    ssl-enabled: false

cube-api:
  tree-root: /aygg_tracking
  connectTimeout: 3000
  readTimeout: 5000

time-series-storage:
  database: digital_coil
  connectTimeout: 3000
  readTimeout: 5000
