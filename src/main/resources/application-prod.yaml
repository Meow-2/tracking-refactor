# ========== 生产部署环境 ==========
# 中间件部署在开发服务器 172.16.203.x

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://172.16.203.30:5432/aygg_tracking}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  redis:
    host: ${REDIS_HOST:172.16.203.18}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    timeout: ${REDIS_TIMEOUT:5000}

mqtt:
  url: ${MQTT_URL:tcp://172.16.203.11:1883}
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}

rocketmq:
  producer:
    endpoints: ${ROCKETMQ_PRODUCER_ENDPOINTS:172.16.203.11:8081}
  push-consumer:
    endpoints: ${ROCKETMQ_CONSUMER_ENDPOINTS:172.16.203.11:8081}

cube-api:
  base-url: ${CUBE_API_BASE_URL:http://172.16.203.12:30800}

time-series-storage:
  base-url: ${TIME_SERIES_STORAGE_BASE_URL:http://127.0.0.1:8886}
